<!-- fragments/header.html -->
<header th:fragment="header" xmlns:th="http://www.w3.org/1999/xhtml">
  <div class="header-content">
    <!-- Для сотрудников -->
    <div th:if="${#authorization.expression('hasRole(''EMPLOYEE'')')}" class="header-role-content">
      <!-- Левая часть - админ-меню -->
      <div class="left-section">
        <a th:href="@{/admin/orders}">Заказы</a>
        <a th:href="@{/admin/dishes}">Меню</a>
        <a th:href="@{/admin/promotions}">Акции</a>
      </div>

      <!-- Правая часть - выход -->
      <div class="right-section">
        <form th:action="@{/logout}" method="post" class="logout-form">
          <button type="submit" class="nav-link login-btn">Выйти</button>
        </form>
      </div>
    </div>

    <!-- Для обычных пользователей -->
    <div th:unless="${#authorization.expression('hasRole(''EMPLOYEE'')')}" class="header-role-content">
      <!-- Левая часть - основное меню -->
      <div class="left-section">
        <a href="/" class="logo">
          <img src="/images/logo3.png" alt="Логотип" class="logo-img">
        </a>
        <nav class="main-nav">
          <a th:href="@{/}">Главная</a>
          <a th:href="@{/menu}">Меню</a>
          <a th:href="@{/orders}">Заказы</a>
        </nav>
      </div>

      <!-- Правая часть - дополнительные опции -->
      <div class="right-section">
          <!-- Кнопка вызова официанта -->
          <button onclick="openCallWaiterModal()" class="call-waiter-btn" title="Вызвать официанта">
              <i class="fas fa-bell"></i>
              <span class="call-text">Официант</span>
          </button>

        <a th:href="@{/restaurant-reviews}">Поделитесь мнением</a>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="auth-section">
          <a th:href="@{/account}">Аккаунт</a>
          <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="nav-link login-btn">Выйти</button>
          </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
          <a th:href="@{/login}" class="nav-link login-btn">Войти</a>
        </div>
      </div>
    </div>
  </div>

    <!-- === МОДАЛЬНОЕ ОКНО ВЫЗОВА ОФИЦИАНТА === -->
    <div id="callWaiterModal" class="waiter-modal-overlay">
        <div class="waiter-modal-content">
            <div class="waiter-modal-header">
                <h3><i class="fas fa-concierge-bell"></i> Вызов официанта</h3>
                <span class="close-btn" onclick="closeCallWaiterModal()">&times;</span>
            </div>

            <div class="waiter-modal-body">
                <p>Укажите номер вашего столика, чтобы мы знали, куда подойти.</p>

                <div class="form-group">
                    <input type="text" id="waiterTableNumber" class="waiter-input" placeholder="Например: 12" required>
                </div>

                <!-- Место для сообщений об ошибках/успехе -->
                <div id="waiterCallMessage" class="waiter-message"></div>
            </div>

            <div class="waiter-modal-footer">
                <button class="btn-cancel-call" onclick="closeCallWaiterModal()">Отмена</button>
                <button class="btn-confirm-call" onclick="submitWaiterCall()">Позвать</button>
            </div>
        </div>
    </div>

    <!-- Подключаем стили и скрипты для вызова -->
    <link rel="stylesheet" href="/css/call-waiter.css">
    <script src="/js/call-waiter.js"></script>
</header>
