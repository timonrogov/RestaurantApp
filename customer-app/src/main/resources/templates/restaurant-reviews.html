<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Favicon -->
  <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

  <title>Отзывы о ресторане</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/restaurant-reviews.css}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
  <h1>Отзывы о ресторане</h1>

  <!-- Если отзывов нет -->
  <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
    <p>Оставьте отзыв первым!</p>
  </div>

  <!-- Если отзывы есть -->
  <div th:unless="${#lists.isEmpty(reviews)}" class="rating-summary">
    <div class="stars">
      <i th:each="i : ${#numbers.sequence(1, 5)}"
         th:classappend="${i <= averageRating} ? 'fas fa-star filled' : 'far fa-star'"></i>
    </div>
    <span th:text="|${averageRating} (${reviewsCount})|"></span>
  </div>

  <!-- Форма отзыва -->
  <form th:action="@{/restaurant-reviews}" method="post" id="reviewForm">
    <div class="rating-input">
      <label>Оценка:</label>
      <div class="stars">
        <i class="far fa-star" data-value="1"></i>
        <i class="far fa-star" data-value="2"></i>
        <i class="far fa-star" data-value="3"></i>
        <i class="far fa-star" data-value="4"></i>
        <i class="far fa-star" data-value="5"></i>
      </div>
      <input type="hidden" name="rating" id="ratingValue">
    </div>

    <textarea name="reviewText" placeholder="Ваш отзыв..."></textarea>

    <button type="submit">Опубликовать</button>

    <div class="error" style="display: none;"></div>
  </form>

  <!-- Список отзывов -->
  <div class="reviews-list">
    <div th:each="review : ${reviews}" class="review-item">
      <div class="review-rating">
        <i th:each="i : ${#numbers.sequence(1, 5)}"
           th:classappend="${i <= review.rating} ? 'fas fa-star filled' : 'far fa-star'"></i>
      </div>
      <p th:text="${review.reviewText} ?: 'Без комментария'"></p>
      <small th:text="${review.client.fullName + ', ' +
                    #temporals.format(review.reviewTime, 'dd.MM.yyyy HH:mm')}"></small>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/restaurant-reviews.js}"></script>
</body>
</html>
