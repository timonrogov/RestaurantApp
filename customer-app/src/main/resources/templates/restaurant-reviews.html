<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">
    <title>Отзывы о ресторане</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/restaurant-reviews.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="main-container">

    <div class="reviews-page-header">
        <h1>Отзывы о ресторане</h1>
        <p class="subtitle">Ваши впечатления помогают нам становиться лучше</p>
    </div>

    <!-- 1. Блок общего рейтинга -->
    <div class="rating-stats-card" th:unless="${#lists.isEmpty(reviews)}">
        <div class="stats-content">
            <div class="stars-large">
                <i th:each="i : ${#numbers.sequence(1, 5)}"
                   th:classappend="${i <= averageRating} ? 'fas fa-star filled' : 'far fa-star'"></i>
            </div>
            <div class="stats-text">
                <span class="avg-val" th:text="${averageRating}">4.5</span>
                <span class="count-val" th:text="'(' + ${reviewsCount} + ' отзывов)'"></span>
            </div>
        </div>
    </div>

    <!-- 2. Форма отзыва (только для авторизованных) -->
    <div class="write-review-container" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="form-card">
            <h3>Оставить свой отзыв</h3>
            <form th:action="@{/restaurant-reviews}" method="post" id="reviewForm">
                <div class="rating-selector">
                    <div class="stars-input">
                        <i class="far fa-star" data-value="1"></i>
                        <i class="far fa-star" data-value="2"></i>
                        <i class="far fa-star" data-value="3"></i>
                        <i class="far fa-star" data-value="4"></i>
                        <i class="far fa-star" data-value="5"></i>
                    </div>
                    <input type="hidden" name="rating" id="ratingValue">
                </div>

                <textarea name="reviewText" placeholder="Расскажите, что вам понравилось..."></textarea>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Опубликовать
                </button>

                <div class="error-inline" style="display: none;"></div>
            </form>
        </div>
    </div>

    <div class="guest-promo" th:unless="${#authorization.expression('isAuthenticated()')}">
        <p><i class="fas fa-info-circle"></i> <a th:href="@{/login}">Войдите</a>, чтобы оставить свой отзыв.</p>
    </div>

    <!-- 3. Список отзывов -->
    <div class="reviews-feed">
        <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews-placeholder">
            <i class="fas fa-pen-fancy"></i>
            <p>Пока нет ни одного отзыва. Будьте первыми!</p>
        </div>

        <div th:each="review : ${reviews}" class="review-bubble">
            <div class="bubble-header">
                <div class="user-info">
                    <div class="user-avatar" th:text="${#strings.substring(review.client.fullName, 0, 1)}"></div>
                    <div class="user-details">
                        <strong th:text="${review.client.fullName}">Имя клиента</strong>
                        <span class="review-date">
                      <i class="far fa-calendar-alt"></i>
                      <span th:text="${#temporals.format(review.reviewTime, 'dd.MM.yyyy')}"></span>
                  </span>
                    </div>
                </div>
                <div class="review-stars">
                    <i th:each="i : ${#numbers.sequence(1, 5)}"
                       th:classappend="${i <= review.rating} ? 'fas fa-star' : 'far fa-star'"></i>
                </div>
            </div>
            <div class="bubble-body">
                <p th:text="${review.reviewText} ?: 'Без комментария'"></p>
            </div>
        </div>
    </div>

    <!-- Кнопка возврата -->
    <div class="footer-navigation">
        <a th:href="@{/menu}" class="btn btn-secondary">
            <i class="fas fa-chevron-left"></i> Вернуться в меню
        </a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/restaurant-reviews.js}"></script>
</body>
</html>
