# ============================================================
# Конфигурация мультиагентного планировщика кухни
# Система «Бобр и Точка!»
# ============================================================

# ------------------------------------------------------------
# Веса свёртки score-функций
# Сумма трёх весов ОБЯЗАНА равняться 1.0
# sync  — насколько точно задача попадает в targetEndTime
# speed — чем раньше начало, тем лучше
# load  — предпочтение менее загруженным поварам
# ------------------------------------------------------------
scheduler.scoring.weight.sync=0.6
scheduler.scoring.weight.speed=0.2
scheduler.scoring.weight.load=0.2

# ------------------------------------------------------------
# Параметры нормализации score-функций
# window-minutes         — окно нормализации speedScore:
#                          при задержке >= N мин относительно notBefore
#                          speedScore падает до 0
# sync-sensitivity-minutes — окно чувствительности syncScore:
#                          при отклонении endTime от targetEndTime >= N мин
#                          syncScore = 0
# load-window-minutes    — за сколько минут вперёд смотрим
#                          при расчёте нагрузки повара (computeLoadScore)
# ------------------------------------------------------------
scheduler.scoring.window-minutes=30
scheduler.scoring.sync-sensitivity-minutes=30
scheduler.scoring.load-window-minutes=30

# ------------------------------------------------------------
# Параметры переговоров и планирования
# max-replan                    — максимальное число перепланирований
#                                 задачи до перевода в FAILED
# horizon-minutes               — deadline = targetEndTime + N мин
# first-course-buffer-minutes   — буфер notBefore при первом планировании
#                                 курса: notBefore = now + N мин
# jit-alignment-buffer-seconds  — задача JIT-выравнивается только если
#                                 отстаёт от targetEndTime более чем на N сек
# ------------------------------------------------------------
scheduler.planning.max-replan=3
scheduler.planning.horizon-minutes=120
scheduler.planning.first-course-buffer-minutes=1
scheduler.planning.jit-alignment-buffer-seconds=30

# ------------------------------------------------------------
# Адаптивные события
# early-finish-threshold-minutes — если повар закончил раньше
#                                   плана более чем на N мин,
#                                   сдвигаем последующие задачи назад
# delay-detect-cron              — cron автообнаружения задержек
# pending-orders-poll-ms         — интервал опроса незапланированных
#                                   заказов (мс)
# auto-delay-ahead-minutes       — на сколько минут сдвигать время
#                                   при автообнаружении задержки
# min-reschedule-gain-minutes    - Минимальный выигрыш (мин) для запуска перепланирования после досрочного завершения.
#                                   Если повар закончил меньше чем на N мин раньше плана —
#                                   не пересчитываем расписание:
#                                   выигрыш не покрывает накладных расходов на сброс и повторный торг.
# ------------------------------------------------------------
scheduler.adaptive.early-finish-threshold-minutes=0
scheduler.adaptive.delay-detect-cron=0 * * * * *
scheduler.adaptive.pending-orders-poll-ms=10000
scheduler.adaptive.auto-delay-ahead-minutes=1
scheduler.adaptive.min-reschedule-gain-minutes=1

# ------------------------------------------------------------
# Ограничения безопасности MessageBus и расписаний
# max-iterations             — максимальное число итераций processAll()
# equipment-slot-max-iters   — максимальное число итераций
#                              findAvailableSlot() в EquipmentTypeSchedule
# ------------------------------------------------------------
scheduler.message-bus.max-iterations=10000
scheduler.message-bus.equipment-slot-max-iters=1000

# ------------------------------------------------------------
# Логгер переговоров (NegotiationFileLogger)
# enabled        — включить запись переговоров агентов в файл
# file-path      — путь к файлу (относительно рабочей директории)
# clear-on-start — очищать файл при каждом старте приложения
# ------------------------------------------------------------
scheduler.logger.enabled=true
scheduler.logger.file-path=negotiations_log.txt
scheduler.logger.clear-on-start=true