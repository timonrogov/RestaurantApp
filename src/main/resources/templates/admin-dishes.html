<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Favicon -->
  <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

  <title>Управление меню</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin-dishes.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
  <h1>Управление меню</h1>

  <table class="dishes-table">
    <thead>
    <tr>
      <th>Фото</th>
      <th>Название</th>
      <th>Описание</th>
      <th>Категория</th>
      <th>Цена</th>
      <th>Статус</th>
      <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dish : ${dishes}">
      <td>
        <img th:if="${dish.imagePath != null}"
             th:src="@{${dish.imagePath}}"
             class="dish-image"
             alt="Фото блюда">
        <img th:unless="${dish.imagePath != null}"
             th:src="@{/images/placeholder.jpg}"
             class="dish-image"
             alt="Фото блюда">
      </td>
      <td th:text="${dish.name}"></td>
      <td th:text="${dish.description}"></td>
      <td th:text="${dish.category.name}"></td>
      <td th:text="${#numbers.formatDecimal(dish.price, 1, 2)} + ' ₽'"></td>
      <td>
                        <span th:class="${dish.available} ? 'status-available' : 'status-unavailable'"
                              th:text="${dish.available} ? 'Доступно' : 'Не доступно'"></span>
      </td>
      <td>
        <form method="post" th:action="@{/admin/dishes/toggle/{id}(id=${dish.id})}">
          <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
          <button type="submit"
                  th:classappend="${dish.available} ? 'toggle-btn unavailable' : 'toggle-btn available'"
                  th:text="${dish.available} ? 'Убрать' : 'Добавить'">
          </button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin-dishes.js}"></script>
</body>
</html>
