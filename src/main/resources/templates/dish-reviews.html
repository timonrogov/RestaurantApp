<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Favicon -->
  <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

  <title>Отзывы на блюдо</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="/css/dish-reviews.css">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="dish-info">
  <h1 th:text="${dish.name}"></h1>
  <img th:src="@{${dish.imagePath}}" alt="Фото блюда" class="dish-image">
  <p th:text="${dish.description}"></p>
  <div class="rating-summary">
      <div class="rating-stars">
        <i th:each="i : ${#numbers.sequence(1, 5)}"
           th:classappend="${i <= dish.averageRating} ? 'fas fa-star' : 'far fa-star'"
           style="color: #ffd700;"></i>
      </div>
    <span th:text="|${dish.getAverageRating()} (${dish.reviews.size()})|"></span>
  </div>
</div>

<div th:if="${dish.composition}" class="composition">
  <div class="composition-inner">
    <h3>Состав</h3>
    <ul>
      <li th:each="ingredient : ${#strings.listSplit(dish.composition, ',')}"
          th:text="${#strings.trim(ingredient)}"></li>
    </ul>
  </div>
</div>

<!-- Блок с весом -->
<div class="weight-container">
  <div th:if="${dish.weight}" class="weight-info">
    <h3>Вес блюда</h3>
    <p th:text="${dish.weight} + ' г'"></p>
  </div>
</div>

<div class="review-form">
  <h2>Оставить отзыв</h2>
  <form th:action="@{/dish/{dishId}/reviews/add(dishId=${dish.id})}" method="post">
    <input type="hidden" name="dishId" th:value="${dish.id}">
    <div class="rating-input">
      <span>Оценка:</span>
      <div class="stars">
        <i class="far fa-star" data-value="1"></i>
        <i class="far fa-star" data-value="2"></i>
        <i class="far fa-star" data-value="3"></i>
        <i class="far fa-star" data-value="4"></i>
        <i class="far fa-star" data-value="5"></i>
      </div>
      <input type="hidden" name="rating" id="ratingValue" value=data-value>
    </div>
    <textarea name="reviewText" placeholder="Ваш отзыв..." ></textarea>
    <button type="submit">Опубликовать</button>
  </form>
</div>

<div class="reviews-list">
  <h2>Отзывы</h2>
  <div th:each="review : ${dish.reviews}" class="review-item">
    <div class="review-rating">
      <span class="stars">
          <i th:each="i : ${#numbers.sequence(1, 5)}"
             th:class="${i <= review.rating} ? 'fas fa-star' : 'far fa-star'"></i>
      </span>
    </div>
    <p class="review-text" th:text="${review.reviewText}"></p>
    <p class="review-author" th:text="|${review.client.fullName}, ${#temporals.format(review.reviewTime, 'dd.MM.yyyy HH:mm')}|"></p>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/dish-reviews.js}"></script>
</body>
</html>
