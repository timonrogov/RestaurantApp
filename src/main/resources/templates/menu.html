<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Favicon -->
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

    <meta charset="UTF-8">
    <title>Меню ресторана</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <!-- CSRF-токен -->
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<!-- Шапка -->
<header th:replace="~{fragments/header :: header}"></header>

<div class="restaurant-status" th:if="${restaurantStatus.status != 'open'}">
    <div class="status-message" th:text="${restaurantStatus.message}"></div>

    <!-- Дополнительная информация для статуса "not_opened_yet" -->
    <div th:if="${restaurantStatus.status == 'not_opened_yet'}">
        <p>Часы работы сегодня:
            <span th:text="${#temporals.format(openingTime, 'HH:mm')}"></span>
            -
            <span th:text="${#temporals.format(closingTime, 'HH:mm')}"></span>
        </p>
    </div>
</div>

<div th:if="${restaurantStatus.status == 'open'}">
    <h1>Меню</h1>

    <!-- Блок акций с слайдером -->
    <div th:if="${activePromotions != null and activePromotions.size() > 0}" class="promo-slider">
        <h2>Акции на сегодня:</h2>
        <div class="slider-container">
            <div class="slider-wrapper">
                <div th:each="promo : ${activePromotions}" class="promo-card">
                    <img th:src="@{${promo.dish.imagePath}}" alt="Фото блюда" class="promo-image"/>
                    <div class="promo-content">
                        <h3 th:text="${promo.dish.name}"></h3>
                        <p th:if="${promo.minQuantity > 1}">
                            При заказе от <span th:text="${promo.minQuantity}"></span> порций
                        </p>
                        <p>Скидка <span th:text="${promo.discount * 100}"></span>%!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="dishSearch" placeholder="Поиск блюд..." class="search-input">
    </div>

    <!-- Навигация по категориям -->
    <div class="category-nav-horizontal" id="categoryNav">
        <div th:each="entry : ${dishesByCategory}" class="nav-item">
            <a th:href="|#category-${entry.key.id}|"
               th:text="${entry.key.name}"
               class="category-link"></a>
        </div>
    </div>


    <!-- Список категорий с блюдами -->
    <div th:each="entry : ${dishesByCategory}">
        <div class="category-section">
            <h2 class="category-title"
                th:id="|category-${entry.key.id}|"
                th:text="${entry.key.name}"></h2>
            <div class="dishes-grid">
                <div th:each="dish : ${entry.value}" class="dish-item" th:data-is-available="${dish.isAvailable}">
                    <h3 th:text="${dish.name}"></h3>

                    <!-- Изображение -->
                    <img th:if="${dish.imagePath != null}"
                         th:src="@{${dish.imagePath}}"
                         alt="Фото блюда"
                         class="dish-image clickable-image"
                         th:data-reviews-url="@{/dish/{id}/reviews(id=${dish.id})}"/>
                    <img th:unless="${dish.imagePath != null}"
                         th:src="@{/static/images/placeholder.jpg}"
                         alt="Фото блюда"
                         class="dish-image clickable-image"
                         th:data-reviews-url="@{/dish/{id}/reviews(id=${dish.id})}"/>

                    <!-- Общий контейнер для описания и рейтинга -->
                    <div class="description-rating-container">
                        <!-- Блок описания -->
                        <div class="dish-description">
                            <p th:text="${dish.description}"></p>
                        </div>

                        <!-- Блок рейтинга -->
                        <div class="rating-block" th:if="${dish.stats}">
                                    <span class="star"
                                          th:classappend="${dish.stats.reviewCount > 0} ? 'yellow' : 'gray'">★</span>
                            <span class="rating-value"
                                  th:text="${dish.stats.reviewCount > 0} ?
                                                    ${#numbers.formatDecimal(dish.stats.averageRating, 1, 1)} : '0.0'"></span>
                            <span class="review-count" th:text="'(' + ${dish.stats.reviewCount} + ')'"></span>
                        </div>
                    </div>

                    <!-- Блок цены -->
                    <div class="price-block">
                        <!-- Если нет активных акций -->
                        <div th:if="${dish.activePromotions == null or dish.activePromotions.size() == 0}">
                            <span class="regular-price"
                                th:text="${#numbers.formatDecimal(dish.price, 1, 2)}"></span>
                        </div>

                        <!-- Если есть активные акции -->
                        <div th:unless="${dish.activePromotions == null or dish.activePromotions.size() == 0}">
                            <div th:each="promo : ${dish.activePromotions}">
                                <!-- Цена со скидкой (показываем всегда, если акция активна) -->
                                <div th:if="${promo.minQuantity <= 1}">
                                        <span class="original-price" style="text-decoration: line-through;"
                                              th:text="${#numbers.formatDecimal(dish.price, 1, 2)}"></span>
                                    <span class="discounted-price"
                                          th:text="${#numbers.formatDecimal(dish.price * (1 - promo.discount), 1, 2)}"></span>
                                </div>

                                <!-- Обычная цена (если minQuantity > 1) -->
                                <div th:unless="${promo.minQuantity <= 1}">
                                    Цена: <span th:text="${#numbers.formatDecimal(dish.price, 1, 2)}"></span>
                                </div>

                                <!-- Информация о скидке -->
                                <p class="discount-info">
                                        <span th:if="${promo.minQuantity > 1}">
                                            При заказе от <span th:text="${promo.minQuantity}"></span> порций
                                        </span>
                                    Скидка <span th:text="${promo.discount * 100}"></span>%!
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Форма добавления -->
                    <form class="add-to-order-form">
                        <input type="hidden" name="dishId" th:value="${dish.id}" />

                        <textarea name="comment" placeholder="Ваш комментарий..."></textarea>

                        <div class="controls-row">
                            <div class="quantity-group">
                                <label>Количество</label>
                                <input type="number" name="quantity" min="1" max="10" value="1" class="quantity-input" />
                            </div>
                            <button type="button" class="add-to-order-btn">
                                <i class="fas fa-cart-plus"></i>
                                Добавить в заказ
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Блок с суммой и кнопкой -->
    <div class="order-summary" style="display: none;"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/menu.js}"></script>
</body>
</html>
