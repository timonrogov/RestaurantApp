<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Favicon -->
  <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

  <title>История заказов</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/orders.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="main-container">
  <h1>Ваши заказы</h1>

  <!-- Фильтр по статусу -->
  <form th:action="@{/orders}" method="get" class="filter-form">
    <select name="statusFilter" class="filter-select">
      <option th:each="status : ${@orderStatusService.getFilterableStatuses()}"
              th:value="${status.name}"
              th:text="${status.name}"
              th:selected="${status.name == statusFilter}"></option>
    </select>
    <button type="submit" class="btn filter-btn">Фильтровать</button>
  </form>

  <!-- Список заказов -->
  <div th:unless="${orders.isEmpty()}" class="orders-list">
    <div th:each="order : ${orders}" class="order-card">
      <div class="order-info">
        <p><strong>Заказ №</strong> <span th:text="${order.id}"></span></p>
        <p><strong>Статус:</strong> <span th:text="${order.status.name}" class="status"></span></p>
        <p><strong>Время заказа:</strong> <span th:text="${#temporals.format(order.timeSlot.orderTime, 'dd.MM.yyyy HH:mm')}"></span></p>
        <p><strong>Столик:</strong> <span th:text="${order.tableNumber}"></span></p>
      </div>
      <a th:href="@{/orders/details/{id}(id=${order.id})}" class="btn details-btn">Подробнее</a>
    </div>
  </div>

  <!-- Сообщение, если заказов нет -->
  <div th:if="${orders.isEmpty()}" class="no-orders">
    <p>Не найдено заказы с таким статусом.</p>
  </div>

  <a th:href="@{/menu}" class="btn back-to-menu">Назад в меню</a>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/orders.js}"></script>
</body>
</html>
