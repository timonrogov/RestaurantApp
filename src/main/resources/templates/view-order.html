<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Favicon -->
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">

    <meta charset="UTF-8">
    <title>Ваш заказ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/view-order.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="main-container">
    <h1>Корзина</h1>

    <!-- Список блюд в виде карточек -->
    <div th:if="${orderItems != null and !orderItems.isEmpty()}" class="order-items">
        <div th:each="item : ${orderItems}" class="order-item">
            <img th:if="${item.dish.imagePath != null}" th:src="@{${item.dish.imagePath}}" alt="Фото блюда" class="dish-image"/>
            <img th:unless="${item.dish.imagePath != null}" th:src="@{/static/images/placeholder.jpg}" alt="Фото блюда" class="dish-image"/>
            <div class="dish-info">
                <h3 th:text="${item.dish.name}"></h3>
                <p>Количество: <span th:text="${item.quantity}"></span></p>
                <p th:if="${item.comment != ''}">Комментарий:</p>
                <div th:if="${item.comment != ''}" class="comment-block">
                    <p th:text="${item.comment != null} ? ${item.comment} : 'Нет'"></p>
                </div>
                <p>Цена:
                    <span th:if="${item.appliedDiscount > 0}" class="original-price" th:text="${#numbers.formatDecimal(item.dish.price, 1, 2)} + ' ₽'"></span>
                    <span th:text="${#numbers.formatDecimal(item.dish.price * (1 - item.appliedDiscount), 1, 2)} + ' ₽'"></span>
                </p>
                <p>Сумма: <span th:text="${#numbers.formatDecimal(item.quantity * item.dish.price * (1 - item.appliedDiscount), 1, 2)} + ' ₽'"></span></p>
            </div>
            <button class="remove-item-btn btn" th:data-item-id="${item.id}">
                <i class="fas fa-trash"></i> Убрать
            </button>
        </div>
    </div>
    <div th:if="${orderItems == null or orderItems.isEmpty()}" class="empty-cart">
        <p>Корзина пуста.</p>
    </div>

    <!-- Итоговая сумма -->
    <div th:if="${not #lists.isEmpty(orderItems)}" class="total-price">
        <p>Итог:
            <span th:if="${totalDiscounted < totalPrice}" class="original-price" th:text="${#numbers.formatDecimal(totalPrice, 1, 2)} + ' ₽'"></span>
            <span th:text="${#numbers.formatDecimal(totalDiscounted, 1, 2)} + ' ₽'"></span>
        </p>
    </div>

    <!-- Блок действий -->
    <div th:if="${not #lists.isEmpty(orderItems)}" class="order-actions">
        <div class="table-number-input">
            <label for="tableNumber">Номер столика:</label>
            <input type="text" id="tableNumber" name="tableNumber" required placeholder="Введите номер столика" value="">
        </div>
        <button id="confirm-order-btn" class="btn">Подтвердить заказ</button>
        <button id="cancel-order-btn" class="btn" th:data-order-id="${order.id}">
            <i class="fas fa-times"></i> Отменить заказ
        </button>
    </div>

    <a th:href="@{/menu}" class="btn back-to-menu">Назад в меню</a>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/view-order.js}"></script>
</body>
</html>
