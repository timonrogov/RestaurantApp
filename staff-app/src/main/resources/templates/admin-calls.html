<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">
    <meta charset="UTF-8">
    <title>Активные вызовы</title>

    <!-- Подключаем стили -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-calls.css}">

    <!-- CSRF токены для AJAX запросов -->
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="main-container">

    <div class="page-header">
        <h1>Активные вызовы</h1>
        <!-- Кнопка ручного обновления (на всякий случай) -->
        <button onclick="location.reload()" class="btn-refresh" title="Обновить список">
            <i class="fas fa-sync-alt"></i>
        </button>
    </div>

    <!-- Контейнер для карточек -->
    <div class="calls-grid">

        <!-- Сообщение, если вызовов нет -->
        <div th:if="${calls.isEmpty()}" class="no-calls">
            <i class="fas fa-check-circle"></i>
            <p>Нет активных вызовов. Отличная работа!</p>
        </div>

        <!-- Карточка вызова -->
        <div th:each="call : ${calls}" class="call-card" th:id="'call-' + ${call.id}">
            <div class="call-header">
                <span class="table-number" th:text="${call.tableNumber}">12</span>
                <span class="table-label">Столик</span>
            </div>

            <div class="call-body">
                <div class="client-info">
                    <i class="fas fa-user"></i>
                    <span th:if="${call.client != null}" th:text="${call.client.fullName}">Имя Клиента</span>
                    <span th:if="${call.client == null}">Гость</span>
                </div>
                <div class="time-info">
                    <i class="far fa-clock"></i>
                    <!-- Форматируем время вызова -->
                    <span th:text="${#temporals.format(call.callTime, 'HH:mm')}">12:30</span>
                    <span class="time-ago" th:data-time="${call.callTime}">(только что)</span>
                </div>
            </div>

            <div class="call-footer">
                <button class="btn-accept" th:onclick="'acceptCall(' + ${call.id} + ')'">
                    Принять
                </button>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<!-- Скрипт конкретно для этой страницы -->
<script th:src="@{/js/admin-calls.js}"></script>

</body>
</html>
