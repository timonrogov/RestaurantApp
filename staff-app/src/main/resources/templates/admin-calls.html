<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">
    <meta charset="UTF-8">
    <title>Активные вызовы</title>

    <!-- Подключаем стили -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin-calls.css}">

    <!-- CSRF токены -->
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="main-container">

    <div class="page-header">
        <h1>Активные вызовы</h1>

        <!-- Кнопка обновления -->
        <!--<button onclick="location.reload()" class="btn-refresh" title="Обновить список">
            <i class="fas fa-sync-alt"></i> Обновить
        </button>-->
    </div>

    <!-- Сетка вызовов -->
    <div class="calls-grid">

        <!-- Сообщение, если вызовов нет -->
        <div th:if="${calls.isEmpty()}" class="no-calls-state">
            <div class="icon-box">
                <i class="fas fa-mug-hot"></i>
            </div>
            <h3>Тишина и спокойствие</h3>
            <p>Активных вызовов пока нет</p>
        </div>

        <!-- Карточка вызова -->
        <div th:each="call : ${calls}" class="call-card" th:id="'call-' + ${call.id}">

            <!-- Шапка с номером стола -->
            <div class="call-header">
                <span class="table-label">Столик</span>
                <span class="table-number" th:text="${call.tableNumber}">12</span>
            </div>

            <!-- Тело с информацией -->
            <div class="call-body">
                <div class="info-row client-row">
                    <i class="fas fa-user-circle"></i>
                    <span th:if="${call.client != null}" th:text="${call.client.fullName}">Имя</span>
                    <span th:if="${call.client == null}">Гость</span>
                </div>

                <div class="info-row time-row">
                    <i class="far fa-clock"></i>
                    <div class="time-data">
                        <span class="exact-time" th:text="${#temporals.format(call.callTime, 'HH:mm')}">12:30</span>
                        <!-- data-time нужен для JS скрипта, который считает минуты -->
                        <span class="time-ago" th:data-time="${call.callTime}">...</span>
                    </div>
                </div>
            </div>

            <!-- Кнопка действия -->
            <div class="call-footer">
                <button class="btn btn-accept" th:onclick="'acceptCall(' + ${call.id} + ')'">
                    <i class="fas fa-check"></i> Завершить вызов
                </button>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin-calls.js}"></script>

</body>
</html>
