<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">
    <meta charset="UTF-8">
    <title>Панель персонала | Заказы</title>

    <!-- Библиотеки и общие стили -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">

    <!-- Специфичные стили для админки -->
    <link rel="stylesheet" th:href="@{/css/admin-orders.css}">

    <!-- CSRF-токены для безопасности POST-запросов -->
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<!-- Подключаем фрагмент шапки -->
<div th:replace="fragments/header :: header"></div>

<div class="main-container">

    <div class="admin-page-header">
        <h1>Управление заказами</h1>
    </div>

    <!-- ТУЛБАР: Фильтры + Поиск в одну строку -->
    <div class="admin-filter-toolbar">
        <div class="admin-quick-filters">
            <a th:href="@{/admin/orders(status='')}"
               th:classappend="${selectedStatus == null or selectedStatus == ''} ? 'active'"
               class="admin-filter-tab">Все заказы</a>

            <a th:href="@{/admin/orders(status='COOKING')}"
               th:classappend="${selectedStatus == 'COOKING'} ? 'active'"
               class="admin-filter-tab">В работе</a>

            <a th:href="@{/admin/orders(status='READY')}"
               th:classappend="${selectedStatus == 'READY'} ? 'active'"
               class="admin-filter-tab">Готовы к выдаче</a>

            <a th:href="@{/admin/orders(status='SERVED')}"
               th:classappend="${selectedStatus == 'SERVED'} ? 'active'"
               class="admin-filter-tab">Завершены</a>

            <a th:href="@{/admin/orders(status='CANCELED')}"
               th:classappend="${selectedStatus == 'CANCELED'} ? 'active'"
               class="admin-filter-tab">Отменены</a>
        </div>

        <!-- Поиск по столику -->
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="tableNumberFilter" placeholder="Столик..." oninput="filterOrdersByTable()">
        </div>
    </div>

    <!-- СЕТКА КАРТОЧЕК ЗАКАЗОВ -->
    <div class="order-grid">

        <!-- Если список пуст -->
        <div th:if="${orders.isEmpty()}" class="empty-data-state">
            <i class="fas fa-clipboard-list"></i>
            <p>Заказов в данной категории пока нет</p>
        </div>

        <!-- Карточка конкретного заказа -->
        <div th:each="order : ${orders}" class="admin-order-card" th:attr="data-order-id=${order.id}">

            <!-- Шапка карточки: Номер и Статус -->
            <div class="card-header" onclick="handleOrderClick(event)">
                <div class="order-id-block">
                    <span class="id-label">ЗАКАЗ</span>
                    <span class="id-value">#<span th:text="${order.id}"></span></span>
                </div>
                <span class="status-badge"
                      th:classappend="'status-' + ${order.status.name().toLowerCase()}"
                      th:text="${order.status.displayName}">
              </span>
            </div>

            <!-- Тело карточки: Детали -->
            <div class="card-body" onclick="handleOrderClick(event)">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">Столик</span>
                        <!-- data-table нужен для работы JS-фильтра -->
                        <span class="value" th:text="${order.tableNumber} ?: '—'" th:attr="data-table=${order.tableNumber} ?: ''"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Время</span>
                        <span class="value" th:text="${#temporals.format(order.timeSlot.orderTime, 'HH:mm')}"></span>
                    </div>
                    <div class="info-item full-width">
                        <span class="label">Клиент</span>
                        <span class="value" th:text="${order.client != null} ? ${order.client.fullName} : 'Гость 👤'"></span>
                    </div>
                </div>

                <!-- Итоговая сумма (шрифт задается в CSS как Lato) -->
                <div class="order-amount">
                    <span th:text="${#numbers.formatDecimal(order.totalPrice, 1, 0)} + ' ₽'"></span>
                </div>
            </div>

            <!-- Действия с заказом (зависят от роли сотрудника) -->
            <div class="card-actions">

                <!-- СЦЕНАРИЙ: Повар переводит из Готовки в Готовность -->
                <form th:if="${order.status.name() == 'COOKING'}"
                      th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                      method="post" sec:authorize="hasAnyRole('COOK', 'ADMIN')">
                    <input type="hidden" name="newStatus" value="READY">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> Готово
                    </button>
                </form>

                <!-- СЦЕНАРИЙ: Официант переводит из Готов в Подан -->
                <form th:if="${order.status.name() == 'READY'}"
                      th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                      method="post" sec:authorize="hasAnyRole('WAITER', 'ADMIN')">
                    <input type="hidden" name="newStatus" value="SERVED">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-hand-holding-heart"></i> Подать
                    </button>
                </form>

                <!-- СЦЕНАРИЙ: Администратор может отменить любой незавершенный заказ -->
                <form th:if="${order.status.name() != 'SERVED' and order.status.name() != 'CANCELED'}"
                      th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                      method="post" sec:authorize="hasRole('ADMIN')">
                    <input type="hidden" name="newStatus" value="CANCELED">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Вы уверены, что хотите отменить этот заказ?')">
                        <i class="fas fa-times"></i> <span>Отменить</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Подключение скриптов -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/admin-orders.js}"></script>

</body>
</html>
