<!-- fragments/header.html -->
<header th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Подключаем FontAwesome и специфичные стили шапки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <div class="header-content">
        <div class="header-wrapper">

            <!-- ЛЕВАЯ ЧАСТЬ: Логотип и Навигация -->
            <div class="header-left">
                <a th:href="@{/}" class="brand-group">
                    <img th:src="@{/images/logo3.png}" alt="Logo" class="header-logo-img">
                    <div class="brand-text">
                        <span class="brand-name">Бобр и Точка!</span>
                        <span class="brand-tagline">Панель персонала</span>
                    </div>
                </a>

                <nav class="header-nav" sec:authorize="isAuthenticated()">
                    <a th:href="@{/admin/orders}" class="nav-item-link">
                        <i class="fas fa-clipboard-list"></i>
                        <span>Заказы</span>
                    </a>

                    <a th:href="@{/kds}"
                       sec:authorize="hasAnyRole('COOK')"
                       class="nav-item-link">
                        <i class="fas fa-utensils"></i>
                        <span>KDS</span>
                    </a>

                    <a th:href="@{/admin/scheduler}"
                       sec:authorize="hasRole('ADMIN')"
                       class="nav-item-link">
                        <i class="fas fa-project-diagram"></i>
                        <span>Планировщик</span>
                    </a>

                    <a th:href="@{/admin/calls}"
                       sec:authorize="hasAnyRole('WAITER')"
                       class="nav-item-link call-nav-link">
                        <i class="fas fa-concierge-bell"></i>
                        <span>Вызовы</span>
                        <span id="callBadge" class="notification-badge" style="display: none;">0</span>
                    </a>

                    <a th:href="@{/admin/dishes}" sec:authorize="hasRole('ADMIN')" class="nav-item-link">
                        <i class="fas fa-book-open"></i>
                        <span>Меню</span>
                    </a>

                    <a th:href="@{/admin/promotions}" sec:authorize="hasRole('ADMIN')" class="nav-item-link">
                        <i class="fas fa-tags"></i>
                        <span>Акции</span>
                    </a>

                    <a th:href="@{/admin/employees}" sec:authorize="hasRole('ADMIN')" class="nav-item-link">
                        <i class="fas fa-users-cog"></i>
                        <span>Персонал</span>
                    </a>
                </nav>
            </div>

            <!-- ПРАВАЯ ЧАСТЬ: Профиль и Выход -->
            <div class="header-right">
                <div sec:authorize="isAuthenticated()" class="user-controls">

                    <a th:href="@{/profile}" class="profile-pill">
                        <div class="profile-info">
                            <span class="u-name"
                                  th:text="${currentEmployeeFullName != null ? currentEmployeeFullName : 'Сотрудник'}">
                                ФИО
                            </span>
                            <span class="u-role">
                                <th:block sec:authorize="hasRole('ADMIN')">Администратор</th:block>
                                <th:block sec:authorize="hasRole('COOK')">Повар</th:block>
                                <th:block sec:authorize="hasRole('WAITER')">Официант</th:block>
                            </span>
                        </div>
                        <div class="profile-icon">
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </a>

                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="btn-logout" title="Выйти из системы">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Выйти</span>
                        </button>
                    </form>
                </div>

                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn-login-header">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Войти</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. СНАЧАЛА ГРУЗИМ JQUERY И TOASTR -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- 2. ЗАТЕМ ГЛОБАЛЬНЫЙ СКРИПТ УВЕДОМЛЕНИЙ -->
    <script sec:authorize="hasAnyRole('WAITER', 'ADMIN')" th:src="@{/js/staff-notifications.js}"></script>

    <!-- 3. ЗАТЕМ WEBSOCKET БИБЛИОТЕКИ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</header>
