<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" th:href="@{/images/icon.png}" type="image/x-icon">
    <meta charset="UTF-8">
    <title>Мой профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="main-container">
    <div class="profile-card">

        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="avatar-large">
                <span th:text="${#strings.substring(employee.fullName, 0, 1)}"></span>
            </div>
            <div class="profile-title">
                <h1 th:text="${employee.fullName}">Фамилия Имя</h1>
                <!-- Роль выделена цветом -->
                <span class="role-badge"
                      th:classappend="${'role-' + employee.account.role.name().toLowerCase()}"
                      th:text="${employee.account.role.displayName}">
                </span>
            </div>
        </div>

        <!-- Данные -->
        <div class="profile-details">

            <div class="detail-group">
                <label>Логин</label>
                <div class="detail-value">
                    <span th:text="${employee.account.username}">@login</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>

            <div class="detail-group">
                <label>Полное имя</label>
                <div class="detail-value">
                    <span th:text="${employee.fullName}">Иванов Иван</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>

            <div class="detail-group">
                <label>Email</label>
                <div class="detail-value">
                    <span th:text="${employee.email}">mail@example.com</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>

            <div class="detail-group">
                <label>Телефон</label>
                <div class="detail-value">
                    <span th:text="${employee.phone}">+7900...</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>

            <div class="detail-group">
                <label>Пол</label>
                <div class="detail-value">
                    <span th:text="${employee.gender}">Мужской</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>

            <div class="detail-group">
                <label>Дата рождения</label>
                <div class="detail-value">
                    <span th:text="${#temporals.format(employee.dateOfBirth, 'dd.MM.yyyy')}">01.01.1990</span>
                    <i class="fas fa-pencil-alt edit-icon" onclick="openEditModal()"></i>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ -->
<div id="editModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Редактирование профиля</h3>
        <form th:action="@{/profile/update}" method="post" class="edit-form">
            <input type="hidden" name="id" th:value="${employee.id}">

            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="username" th:value="${employee.account.username}" required>
            </div>

            <div class="form-group">
                <label>Полное имя</label>
                <input type="text" name="fullName" th:value="${employee.fullName}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" th:value="${employee.email}" required>
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" name="phone" th:value="${employee.phone}" required>
            </div>

            <div class="form-group">
                <label>Пол</label>
                <select name="gender">
                    <option value="Мужской" th:selected="${employee.gender == 'Мужской'}">Мужской</option>
                    <option value="Женский" th:selected="${employee.gender == 'Женский'}">Женский</option>
                </select>
            </div>

            <div class="form-group">
                <label>Дата рождения</label>
                <input type="date" name="dateOfBirth" th:value="${employee.dateOfBirth}" required>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/profile.js}"></script>

<script th:if="${success}">
    toastr.success([[${success}]]);
</script>
<script th:if="${error}">
    toastr.error([[${error}]]);
</script>

</body>
</html>
